# Bakes your real 3D Roblox avatar into avatar/ so the site shows the exact fit.
# Setup (once): add a repository secret named ROBLOX_API_KEY (see README → "Your real avatar").
# Then open the Actions tab → "Bake avatar" → the latest run → "Re-run all jobs"
# (or "Run workflow", on the default branch). Re-run it whenever you change your avatar.
name: Bake avatar

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bake-avatar.yml
      - tools/fetch-avatar.mjs
  schedule:
    - cron: "17 6 * * 1"   # Mondays: picks up outfit changes (default branch only)

permissions:
  contents: write

concurrency:
  group: bake-avatar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bake the avatar
        id: bake
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_COOKIE: ${{ secrets.ROBLOX_COOKIE }}
        run: |
          if [ -z "$ROBLOX_API_KEY" ] && [ -z "$ROBLOX_COOKIE" ]; then
            echo "::warning title=No Roblox key yet::Add a repository secret named ROBLOX_API_KEY (Settings → Secrets and variables → Actions), then re-run this workflow."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/fetch-avatar.mjs

      - name: Commit avatar/
        if: steps.bake.outputs.skipped != '1'
        run: |
          git add -A avatar
          if git diff --cached --quiet; then
            echo "Avatar unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bake avatar ($(date -u +%Y-%m-%d))"
          git push
